[package]
name = "merkle-proofs-openzeppelin"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
openzeppelin-crypto = { git = "https://github.com/OpenZeppelin/rust-contracts-stylus", tag = "v0.2.0" }
alloy-primitives = { version = "=0.8.20", default-features = false, features = ["tiny-keccak"] }
alloy-sol-types = "=0.8.20"
stylus-sdk = "0.9.0"
ruint = "=1.15.0"

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
mini-alloc = ["stylus-sdk/mini-alloc"]

[[bin]]
name = "merkle-proofs-openzeppelin"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
