services:
  wizard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wizard-backend
    ports:
      - "8080:8080"
      - "8443:8443"
      - "80:80"
    volumes:
      # Mount projects directory from host to container
      - /data/wizard-projects:/app/projects
      # Mount for Let's Encrypt certificates
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    env_file:
      - .env.production
    environment:
      # Override storage path for container
      - STORAGE_PATH=/app/projects
      - HOST=0.0.0.0
      - PORT=8080
      - RUST_LOG=info
      - EMAIL=admin@thewizard.app
    restart: unless-stopped
    networks:
      - wizard-network

networks:
  wizard-network:
    driver: bridge