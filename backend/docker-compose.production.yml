version: '3.8'

# Named volumes for data persistence
volumes:
  wizard-projects:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/wizard-data/projects
  
  cargo-registry:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/wizard-data/cargo-registry
  
  build-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/wizard-data/build-cache

  nginx-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/wizard-data/nginx-cache

# Custom network for service isolation
networks:
  wizard-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # Nginx reverse proxy with SSL termination
  nginx:
    image: nginx:alpine
    container_name: wizard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
      - wizard-projects:/app/storage:ro  # For serving static files
    networks:
      - wizard-network
    depends_on:
      - backend
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Main backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: wizard-backend:production
    container_name: wizard-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - STORAGE_PATH=/app/storage
      - CARGO_HOME=/app/cargo-cache
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=8080
    volumes:
      - wizard-projects:/app/storage:rw
      - cargo-registry:/app/cargo-cache:rw
      - build-cache:/tmp/build-cache:rw
      # Docker socket for container management (secured)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - wizard-network
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Compilation worker pool (shared containers)
  compiler-worker:
    build:
      context: .
      dockerfile: Dockerfile.compiler
    image: wizard-compiler:production
    restart: unless-stopped
    environment:
      - WORKER_TYPE=compiler
      - MAX_COMPILATION_TIME=30
      - CARGO_HOME=/app/cargo-cache
    volumes:
      - wizard-projects:/app/projects:rw
      - cargo-registry:/app/cargo-cache:rw
      - build-cache:/tmp/build-cache:rw
    networks:
      - wizard-network
    deploy:
      replicas: 4
      resources:
        limits:
          memory: 1g
          cpus: '0.5'
        reservations:
          memory: 512m
          cpus: '0.25'
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Resource monitor and cleanup service
  resource-monitor:
    image: alpine:3.19
    container_name: wizard-monitor
    restart: unless-stopped
    volumes:
      - ./scripts/resource-monitor.sh:/monitor.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - wizard-projects:/app/storage:rw
    command: ["/bin/sh", "/monitor.sh"]
    networks:
      - wizard-network
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Backup service (runs periodically)
  backup:
    image: alpine:3.19
    container_name: wizard-backup
    restart: unless-stopped
    volumes:
      - wizard-projects:/data/projects:ro
      - /opt/wizard-data/backups:/backups:rw
      - ./scripts/backup.sh:/backup.sh:ro
    environment:
      - BACKUP_SCHEDULE=0 */6 * * *  # Every 6 hours
      - RETENTION_DAYS=7
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BACKUP_BUCKET}
    command: ["/bin/sh", "-c", "apk add --no-cache aws-cli tar && crond -f -L /dev/stdout"]
    networks:
      - wizard-network
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# Resource limits for the entire stack
# Total memory usage should not exceed 10GB
# CPU usage is limited to prevent system overload