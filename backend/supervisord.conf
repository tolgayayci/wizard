[supervisord]
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wizard-backend]
command=/app/target/release/wizard-backend
directory=/app
autostart=true
autorestart=true
user=wizard
environment=RUST_LOG="info",HOST="0.0.0.0",PORT="8080",STORAGE_PATH="/app/projects"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0